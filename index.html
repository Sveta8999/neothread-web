<!DOCTYPE html>
<html>
<head>
  <base href="/neothread-web/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoThread - социальная сеть">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NeoThread">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>NeoThread</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; padding: 0; background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%); min-height: 100vh; overflow: hidden; }
    #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; z-index: 9999; }
    .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-top-color: #8B5CF6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading h2 { margin-top: 24px; font-size: 24px; font-weight: 600; }
    #loading p { margin-top: 8px; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <h2>NeoThread</h2>
    <p>Загрузка приложения...</p>
  </div>

  <script>
    // Очистка кэша при загрузке
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) { for(let reg of r) { reg.unregister(); } });
    }
    if ('caches' in window) {
      caches.keys().then(function(n) { for (let name of n) { caches.delete(name); } });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; l.style.transition = 'opacity 0.3s'; setTimeout(function() { l.style.display = 'none'; }, 300); }
    });
  </script>
</body>
</html>
